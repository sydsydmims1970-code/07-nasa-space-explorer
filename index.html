<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div>
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <main>
      <form class="filters" id="dateForm">
        <label>
          <span>From</span>
          <input type="date" id="startDate" required />
        </label>
        <label>
          <span>Through</span>
          <input type="date" id="endDate" required />
        </label>
        <label>
          <span>NASA API key</span>
          <input type="password" id="apiKey" placeholder="Paste your personal key" autocomplete="off" />
        </label>
        <button type="submit">Get Space Images</button>
      </form>
      <p class="key-note">NASA's shared demo key is currently returning a generic image. <a href="https://api.nasa.gov/" target="_blank" rel="noopener noreferrer">Get a free personal key</a>. It is not saved by this page.</p>

      <p id="status" class="status" role="status" aria-live="polite">Select a date range to explore the cosmos.</p>
      <section id="gallery" class="gallery" aria-label="Astronomy pictures"></section>
    </main>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
