<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA logo" class="logo" />
      <div>
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <form class="filters" id="dateForm">
      <label for="startDate">From<input type="date" id="startDate" required /></label>
      <label for="endDate">Through<input type="date" id="endDate" required /></label>
      <label for="apiKey">NASA API key<input type="password" id="apiKey" placeholder="Paste your personal key" autocomplete="off" /></label>
      <button type="submit" id="loadButton">Get Space Images</button>
    </form>
    <p class="key-note">A personal key is required because NASA's demo key is returning a generic image. <a href="https://api.nasa.gov/" target="_blank" rel="noreferrer">Get a free NASA API key</a>. This page does not save it.</p>

    <div id="gallery" class="gallery" aria-live="polite" aria-busy="false">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="photoModal" class="photo-modal" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" aria-label="Close photo details">Close</button>
    <img id="modalImage" class="modal-image" alt="" />
    <div class="modal-copy">
      <p class="modal-date" id="modalDate"></p>
      <h2 id="modalTitle"></h2>
      <p id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
